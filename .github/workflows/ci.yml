name: Test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: '1'
      - name: Role definitions
        run: python tools/role_agents.py build --check
      - name: Release metadata
        run: python tools/check_release.py
      - name: Package
        run: python tools/package_plugin.py
        env:
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/project-lifecycle-agent-v*.zip

  sandbox-boundary:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install local verification CLI (no model authentication)
        run: npm install --global @openai/codex@0.170.0
      - name: Linux sandbox dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Resolve explicit sandbox CLI
        run: python -c "import os,shutil; p=shutil.which('codex'); assert p; open(os.environ['GITHUB_ENV'],'a').write('IEUM_SANDBOX_CLI='+p+'\n')"
      - name: Real OS boundary and process lifetime regressions
        run: python -m unittest discover -s tests -p test_verification_sandbox.py -v
        env:
          PYTHONUTF8: '1'
