name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'plugin.json'
      - '.codex-plugin/plugin.json'
      - '.claude-plugin/plugin.json'
      - 'blueprint/project.json'
      - 'README.md'
      - 'docs/V2-IMPLEMENTATION.md'
      - 'tools/check_release.py'
      - 'examples/customer-portal/**'
      - '.github/workflows/website.yml'
      - '.github/workflows/website-checks.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'plugin.json'
      - '.codex-plugin/plugin.json'
      - '.claude-plugin/plugin.json'
      - 'blueprint/project.json'
      - 'README.md'
      - 'docs/V2-IMPLEMENTATION.md'
      - 'tools/check_release.py'
      - 'examples/customer-portal/**'
      - '.github/workflows/website.yml'
      - '.github/workflows/website-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/website-checks.yml
    with:
      upload_pages: ${{ github.event_name != 'pull_request' }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
