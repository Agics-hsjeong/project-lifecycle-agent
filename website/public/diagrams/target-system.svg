<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 542" width="1120" height="542" role="img" aria-labelledby="art-title-target-system art-desc-target-system" style="font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title id="art-title-target-system">가상 고객 포털 목표 시스템 개념 설계</title><desc id="art-desc-target-system">설명용 설계 예시입니다. 고객과 운영 담당자는 반응형 화면과 인증·권한 검사를 거쳐 문의 서비스와 데이터에 접근합니다. 방문자는 FAQ와 공지를 읽습니다. 역할과 문의 소유자 검사가 REQ-001에 대응합니다. 기술 제품과 호스팅은 미확정입니다.</desc><defs><pattern id="grid-target-system" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6e2d7" stroke-width=".6"/></pattern><linearGradient id="surface-target-system" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f4e5"/><stop offset="1" stop-color="#90c6b0"/></linearGradient><linearGradient id="side-target-system" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#729f8b"/><stop offset="1" stop-color="#2f6256"/></linearGradient></defs><rect x="0" y="0" width="1120" height="542" rx="0" fill="#f3f7f0" stroke="none" /><rect x="0" y="0" width="1120" height="542" rx="0" fill="url(#grid-target-system)" stroke="none" /><text x="30" y="31" fill="#536d63" font-size="11" font-weight="500" text-anchor="start" letter-spacing="1">ILLUSTRATIVE SYSTEM / 가상 고객 포털</text><text x="1090" y="31" fill="#536d63" font-size="11" font-weight="400" text-anchor="end" >RFP 2.1–2.6</text><text x="30" y="81" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >이용자</text><g class="system-access"><rect x="30" y="103" width="200" height="77" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="46" y="132" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >고객</text><text x="46" y="154" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >자신의 문의 · 상태 확인</text></g><g class="system-access"><rect x="30" y="206" width="200" height="77" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="46" y="235" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >운영 담당자</text><text x="46" y="257" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >분류 · 답변 · 상태 변경</text></g><g class="system-data"><rect x="30" y="309" width="200" height="77" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="46" y="338" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >방문자</text><text x="46" y="360" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >FAQ · 공지 열람</text></g><path d="M230 142H278V151H332M230 245H278V151M230 348H264V426H716V348H744" fill="none" stroke="#749787" stroke-width="1.5" /><rect x="312" y="62" width="342" height="352" rx="10" fill="#e4eee2" stroke="#c0d1bf" /><text x="332" y="89" fill="#536d63" font-size="11" font-weight="500" text-anchor="start" >APPLICATION / 서비스 경계</text><g class="system-access system-data"><rect x="332" y="112" width="302" height="78" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="348" y="141" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >고객 · 운영 화면</text><text x="348" y="163" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >반응형 UI · 키보드 접근</text></g><path d="M483 190V215" fill="none" stroke="#086b6c" stroke-width="1.7" /><g class="system-access"><rect x="332" y="215" width="302" height="78" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="348" y="244" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >인증 · 권한 검사</text><text x="348" y="266" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >역할과 문의 소유자 확인</text><text x="620" y="239" fill="#086b6c" font-size="10" font-weight="500" text-anchor="end" >REQ-001</text></g><path d="M483 293V318" fill="none" stroke="#086b6c" stroke-width="1.7" /><g class="system-data"><rect x="332" y="318" width="302" height="76" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="348" y="347" fill="#193d36" font-size="16" font-weight="600"