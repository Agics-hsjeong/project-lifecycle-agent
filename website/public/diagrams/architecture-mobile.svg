<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 902" width="360" height="902" role="img" aria-labelledby="art-title-architecture-mobile art-desc-architecture-mobile" style="font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title id="art-title-architecture-mobile">프로젝트이음 실행 아키텍처</title><desc id="art-desc-architecture-mobile">Codex 또는 Claude Code가 실제 작업을 수행합니다. 이음의 스킬과 Python 관리 엔진이 업무 규칙, 원장, 변경 근거와 단계 검토를 관리합니다. 자료, 산출물, project.json, registers 원장, state 기록과 HANDOFF.md는 고객 프로젝트 폴더에 저장됩니다. 별도 상시 서버는 포함하지 않습니다.</desc><defs><pattern id="grid-architecture-mobile" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25483e" stroke-width=".6"/></pattern><linearGradient id="surface-architecture-mobile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f4e5"/><stop offset="1" stop-color="#90c6b0"/></linearGradient><linearGradient id="side-architecture-mobile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#729f8b"/><stop offset="1" stop-color="#2f6256"/></linearGradient></defs><rect x="0" y="0" width="360" height="902" rx="0" fill="#102d29" stroke="none" /><rect x="0" y="0" width="360" height="902" rx="0" fill="url(#grid-architecture-mobile)" stroke="none" /><text x="22" y="34" fill="#bdd8c4" font-size="11" font-weight="500" text-anchor="start" letter-spacing="1.2">01 / AI HOST</text><rect x="22" y="53" width="150" height="72" rx="8" fill="#173c34" stroke="#436556" /><text x="40" y="82" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >Codex</text><text x="40" y="105" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >활성 세션</text><rect x="188" y="53" width="150" height="72" rx="8" fill="#173c34" stroke="#436556" /><text x="206" y="82" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >Claude Code</text><text x="206" y="105" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >활성 세션</text><path d="M97 125V148H263V125M180 148V184" fill="none" stroke="#9fcbb2" stroke-width="1.4" /><text x="180" y="173" fill="#c3d8c9" font-size="11" font-weight="400" text-anchor="middle" >작업 수행 · 제작 · 렌더링</text><rect x="16" y="191" width="328" height="356" rx="10" fill="#1a4238" stroke="#668b73" /><text x="34" y="222" fill="#d5eddb" font-size="12" font-weight="600" text-anchor="start" >02 / PROJECT IEUM</text><rect x="34" y="243" width="292" height="72" rx="8" fill="#173c34" stroke="#436556" /><text x="52" y="272" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >업무 규칙</text><text x="52" y="295" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >스킬 · 기본 양식 · 지침</text><rect x="34" y="331" width="292" height="72" rx="8" fill="#173c34" stroke="#436556" /><text x="52" y="360" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >관리 엔진</text><text x="52" y="383" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >입력 · 원장 · 실행 기록</text><rect x="34" y="419" width="292" height="72" rx="8" fill="#173c34" stroke="#436556" /><text x="52" y="448" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >검토와 단계 이동</text><text x="52" y="471" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >변경 해시 · 근거 · 승인</text><text x="34" y="529" fill="#bdd6c4" font-size="11" font-weight="400" text-anchor="start" >SKILL + PYTHON · 상태와 근거 관리</text><path d="M180 547L180 597" fill="none" stroke="#9fcbb2" stroke-width="1.3" /><text x="22" y="584" fill="#bdd8c4" font-size="11" font-weight="500" text-anchor="start" >03 / LOCAL WORKSPACE</text><rect x="22" y="605" width="316" height="70" rx="8" fill="#173c34" stroke="#436556" /><text x="40" y="634" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >자료와 산출물</text><text x="40" y="657" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >inputs/ · templates/ · docs/ · proposal/</text><rect x="22" y="691" width="316" height="70" rx="8" fill="#173c34" stroke="#436556" /><t