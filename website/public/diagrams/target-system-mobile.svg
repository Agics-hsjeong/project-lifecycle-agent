<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 798" width="360" height="798" role="img" aria-labelledby="art-title-target-system-mobile art-desc-target-system-mobile" style="font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title id="art-title-target-system-mobile">가상 고객 포털 목표 시스템 개념 설계</title><desc id="art-desc-target-system-mobile">설명용 설계 예시입니다. 고객과 운영 담당자는 반응형 화면과 인증·권한 검사를 거쳐 문의 서비스와 데이터에 접근합니다. 방문자는 FAQ와 공지를 읽습니다. 역할과 문의 소유자 검사가 REQ-001에 대응합니다. 기술 제품과 호스팅은 미확정입니다.</desc><defs><pattern id="grid-target-system-mobile" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6e2d7" stroke-width=".6"/></pattern><linearGradient id="surface-target-system-mobile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f4e5"/><stop offset="1" stop-color="#90c6b0"/></linearGradient><linearGradient id="side-target-system-mobile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#729f8b"/><stop offset="1" stop-color="#2f6256"/></linearGradient></defs><rect x="0" y="0" width="360" height="798" rx="0" fill="#f3f7f0" stroke="none" /><rect x="0" y="0" width="360" height="798" rx="0" fill="url(#grid-target-system-mobile)" stroke="none" /><text x="20" y="29" fill="#536d63" font-size="12" font-weight="500" text-anchor="start" >가상 고객 포털 / 목표 시스템 예시</text><g class="system-access"><rect x="20" y="50" width="152" height="73" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="36" y="79" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >고객</text><text x="36" y="101" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >내 문의 · 상태 확인</text></g><g class="system-access"><rect x="188" y="50" width="152" height="73" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="204" y="79" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >운영 담당자</text><text x="204" y="101" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >분류 · 답변 · 변경</text></g><path d="M96 123V148H264V123M180 148V174" fill="none" stroke="#749787" stroke-width="1.4" /><rect x="12" y="173" width="336" height="316" rx="10" fill="#e4eee2" stroke="#c0d1bf" /><text x="30" y="199" fill="#536d63" font-size="11" font-weight="500" text-anchor="start" >APPLICATION / 서비스 경계</text><g class="system-access system-data"><rect x="30" y="215" width="300" height="70" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="46" y="244" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >고객 · 운영 화면</text><text x="46" y="266" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >반응형 UI · 키보드 접근</text></g><path d="M180 285L180 305" fill="none" stroke="#086b6c" stroke-width="1.3" /><g class="system-access"><rect x="30" y="305" width="300" height="70" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="46" y="334" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >인증 · 권한 검사</text><text x="46" y="356" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >역할과 문의 소유자 확인</text><text x="316" y="329" fill="#086b6c" font-size="10" font-weight="500" text-anchor="end" >REQ-001</text></g><path d="M180 375L180 395" fill="none" stroke="#086b6c" stroke-width="1.3" /><g class="system-data"><rect x="30" y="395" width="300" height="70" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="46" y="424" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >문의 서비스</text><text x="46" y="446" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >등록 · 목록 · 상세 · 상태</text></g><path d="M180 489L180 515" fill="none" stroke="#086b6c" stroke-width="1.3" /><g class="system-access system-data"><rect x="20" y="515" width="320" height="74" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="36" y="544" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >계정 · 문의 · 처리 이력</text><text x="36" y="566" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >권한 검사 후 허용된 데이터에 접근</text></g><g class="system-data"><rect x="20" y="615" width="320" height="70" rx="8" fill="#fff" stroke="#b9ccbd" class="node-box"/><text x="36" y="644" fill="#193d36" font-size="16" font-weight="600" text-anchor="start" >FAQ · 공지</text><text x="36" y="666" fill="#536d63" font-size="12" font-weight="400" text-anchor="start" >방문자도 읽는 공개 정보</text></g><rect x="20" y="713" width="320" height="65" rx="8" fill="#e1ece0" stroke="#bfceba" /><text x="36" y="739" fill="#193d36" font-size="13" font-weight="600" text-anchor="start" >운영 인수</text><text x="36" y="762" fill="#536d63" font-size="11" font-weight="400" text-anchor="start" >배포·복구 절차 · 매뉴얼 · 테스트 결과</text></svg>