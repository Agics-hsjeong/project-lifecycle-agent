<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 595" width="1120" height="595" role="img" aria-labelledby="art-title-architecture art-desc-architecture" style="font-family:Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><title id="art-title-architecture">프로젝트이음 실행 아키텍처</title><desc id="art-desc-architecture">Codex 또는 Claude Code가 실제 작업을 수행합니다. 이음의 스킬과 Python 관리 엔진이 업무 규칙, 원장, 변경 근거와 단계 검토를 관리합니다. 자료, 산출물, project.json, registers 원장, state 기록과 HANDOFF.md는 고객 프로젝트 폴더에 저장됩니다. 별도 상시 서버는 포함하지 않습니다.</desc><defs><pattern id="grid-architecture" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#244550" stroke-width=".6"/></pattern><linearGradient id="surface-architecture" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f4e5"/><stop offset="1" stop-color="#90c6b0"/></linearGradient><linearGradient id="side-architecture" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#729f8b"/><stop offset="1" stop-color="#2f6256"/></linearGradient></defs><rect x="0" y="0" width="1120" height="595" rx="0" fill="#0b2028" stroke="none" /><rect x="0" y="0" width="1120" height="595" rx="0" fill="url(#grid-architecture)" stroke="none" /><text x="32" y="45" fill="#a7c7b2" font-size="12" font-weight="400" text-anchor="start" >01</text><text x="65" y="45" fill="#b8d2bf" font-size="12" font-weight="500" text-anchor="start" letter-spacing="1.3">AI HOST</text><rect x="265" y="22" width="258" height="70" rx="8" fill="#15333e" stroke="#466876" /><text x="283" y="51" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >Codex</text><text x="283" y="74" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >활성 세션에서 실행</text><rect x="549" y="22" width="258" height="70" rx="8" fill="#15333e" stroke="#466876" /><text x="567" y="51" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >Claude Code</text><text x="567" y="74" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >활성 세션에서 실행</text><path d="M394 92V121H678V92M536 121V148" fill="none" stroke="#9fcbb2" stroke-width="1.4" /><text x="833" y="63" fill="#c3d8c9" font-size="12" font-weight="400" text-anchor="start" >작업 수행 · 파일 제작 · 렌더링</text><rect x="28" y="148" width="1064" height="222" rx="12" fill="#1b3e47" stroke="#5a7f8a" /><text x="52" y="182" fill="#d5eddb" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1">02  PROJECT IEUM</text><text x="1067" y="182" fill="#abc7b4" font-size="11" font-weight="400" text-anchor="end" >SKILL + PYTHON</text><rect x="52" y="208" width="320" height="96" rx="8" fill="#15333e" stroke="#466876" /><text x="70" y="237" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >업무 규칙</text><text x="70" y="260" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >스킬 · 기본 양식 · 지침</text><text x="70" y="285" fill="#a8cbb6" font-size="10" font-weight="400" text-anchor="start" >SI / PRODUCT / API / MAINTENANCE</text><rect x="400" y="208" width="320" height="96" rx="8" fill="#15333e" stroke="#466876" /><text x="418" y="237" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >관리 엔진</text><text x="418" y="260" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >입력 · 원장 · 실행 기록</text><text x="418" y="285" fill="#a8cbb6" font-size="10" font-weight="400" text-anchor="start" >inspect → apply → review → advance</text><rect x="748" y="208" width="320" height="96" rx="8" fill="#15333e" stroke="#466876" /><text x="766" y="237" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >검토와 단계 이동</text><text x="766" y="260" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >변경 해시 · 근거 · 승인</text><text x="766" y="285" fill="#a8cbb6" font-size="10" font-weight="400" text-anchor="start" >근거가 바뀌면 다시 확인</text><text x="52" y="342" fill="#bcd6c4" font-size="13" font-weight="400" text-anchor="start" >실제 작업은 호스트가 수행하고, 엔진은 상태·연결·검토 근거를 관리합니다.</text><path d="M560 370V414M200 414H920M200 414V437M560 414V437M920 414V437" fill="none" stroke="#8dbba1" stroke-width="1.4" /><text x="32" y="406" fill="#c2d8c8" font-size="11" font-weight="500" text-anchor="start" letter-spacing="1.2">03  LOCAL WORKSPACE</text><rect x="28" y="437" width="336" height="86" rx="8" fill="#15333e" stroke="#466876" /><text x="46" y="466" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >자료와 산출물</text><text x="46" y="489" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >inputs/ · templates/ · docs/ · proposal/</text><rect x="392" y="437" width="336" height="86" rx="8" fill="#15333e" stroke="#466876" /><text x="410" y="466" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >진행 기준과 원장</text><text x="410" y="489" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >project.json · registers/*.csv</text><rect x="756" y="437" width="336" height="86" rx="8" fill="#15333e" stroke="#466876" /><text x="774" y="466" fill="#e5f2e8" font-size="16" font-weight="600" text-anchor="start" >근거와 인수인계</text><text x="774" y="489" fill="#b4c9b9" font-size="12" font-weight="400" text-anchor="start" >state/ · HANDOFF.md</text><text x="32" y="566" fill="#b7cfbd" font-size="12" font-weight="400" text-anchor="start" >사용자의 프로젝트 폴더</text><text x="1088" y="566" fill="#b7cfbd" font-size="12" font-weight="400" text-anchor="end" >설치 폴더와 고객 자료 분리  /  별도 상시 서버 없음</text></svg>